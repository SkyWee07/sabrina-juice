<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Sabrina Juice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center font-[Segoe_UI,Roboto,Arial,sans-serif]">

    <div class="w-full max-w-sm px-4">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-amber-500 flex items-center justify-center text-white text-2xl shadow-lg mb-3">
                <i class="fas fa-glass-water"></i>
            </div>
            <h1 class="text-white font-bold text-xl">Sabrina Juice</h1>
            <p class="text-slate-400 text-sm mt-1">Panel Admin v1.0</p>
        </div>

        <!-- Card -->
        <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 shadow-xl">
            <h2 class="text-white font-bold text-base mb-5">Masuk ke Dashboard</h2>

            <!-- Alert error -->
            <div id="alert-error" class="hidden mb-4 px-4 py-3 bg-rose-500/10 border border-rose-500/30 rounded-xl flex items-center gap-2 text-rose-400 text-sm">
                <i class="fas fa-circle-exclamation"></i>
                <span id="alert-msg">Username atau password salah.</span>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Username</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">
                            <i class="fas fa-user"></i>
                        </span>
                        <input id="username" type="text" placeholder="admin"
                            class="w-full bg-slate-900 border border-slate-600 text-white text-sm rounded-xl pl-9 pr-4 py-2.5 focus:outline-none focus:border-amber-500 placeholder-slate-600 transition-colors">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-sm">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input id="password" type="password" placeholder="••••••••"
                            class="w-full bg-slate-900 border border-slate-600 text-white text-sm rounded-xl pl-9 pr-10 py-2.5 focus:outline-none focus:border-amber-500 placeholder-slate-600 transition-colors">
                        <button type="button" onclick="togglePassword()" 
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-sm transition-colors">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button id="login-btn" type="submit"
                    class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-white font-bold text-sm rounded-xl transition-colors flex items-center justify-center gap-2 mt-2">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    <span>Masuk</span>
                </button>
            </form>
        </div>

        <p class="text-center text-slate-600 text-xs mt-6">Sabrina Juice &copy; 2024 — Internal Use Only</p>
    </div>

    <script>
        const API_BASE = '/api/admin';

        // Kalau sudah login, langsung redirect ke dashboard
        if (sessionStorage.getItem('admin_logged_in') === 'true') {
            window.location.href = 'index.html';
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function showError(msg) {
            const alert = document.getElementById('alert-error');
            document.getElementById('alert-msg').textContent = msg;
            alert.classList.remove('hidden');
        }

        function setLoading(loading) {
            const btn = document.getElementById('login-btn');
            btn.disabled = loading;
            btn.innerHTML = loading
                ? '<i class="fas fa-spinner fa-spin"></i><span>Memproses...</span>'
                : '<i class="fas fa-arrow-right-to-bracket"></i><span>Masuk</span>';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('alert-error').classList.add('hidden');

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Username dan password wajib diisi.');
                return;
            }

            setLoading(true);
            try {
                const res = await fetch(`${API_BASE}/login.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('admin_logged_in', 'true');
                    sessionStorage.setItem('admin_username', username);
                    window.location.href = 'index.html';
                } else {
                    showError(data.message || 'Login gagal.');
                }
            } catch (err) {
                showError('Tidak dapat terhubung ke server. Coba lagi.');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
